<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Classic GomiMon sprite - trash can monster -->
  <defs>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Trash can body -->
  <rect x="30" y="45" width="40" height="40" fill="url(#canGrad)" stroke="#333" stroke-width="2" rx="3"/>
  <path d="M 25 45 L 30 45 L 30 40 L 70 40 L 70 45 L 75 45" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Horizontal lines on can -->
  <line x1="30" y1="55" x2="70" y2="55" stroke="#333" stroke-width="1" opacity="0.3"/>
  <line x1="30" y1="65" x2="70" y2="65" stroke="#333" stroke-width="1" opacity="0.3"/>
  <line x1="30" y1="75" x2="70" y2="75" stroke="#333" stroke-width="1" opacity="0.3"/>

  <!-- Eyes peeking out -->
  <circle cx="40" cy="30" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="60" cy="30" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="40" cy="30" r="3" fill="#333"/>
  <circle cx="60" cy="30" r="3" fill="#333"/>

  <!-- Arms -->
  <path d="M 30 60 L 20 55 L 15 60" stroke="#764ba2" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 70 60 L 80 55 L 85 60" stroke="#764ba2" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Happy expression -->
  <path d="M 40 50 Q 50 55 60 50" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
