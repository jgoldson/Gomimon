<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.copy { position: absolute; left: 76px; top: 72px; width: 400px; }
.copy h1 { margin: 24px 0 24px; font-size: 64px; }
.steps { margin-top: 28px; display: grid; gap: 14px; }
.step { display: flex; gap: 14px; align-items: center; font-size: 21px; font-weight: 600; }
.step b { font-family: Silkscreen, monospace; font-weight: 400; width: 40px; height: 40px; border-radius: 12px; background: var(--ink); color: #fff5d2; display: grid; place-items: center; font-size: 18px; flex: none; }
.zoom { position: absolute; border: 4px solid var(--ink); border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 8px 0 rgba(21,38,61,.9), 0 20px 40px rgba(80,60,10,.25); }
</style></head><body><div class="stage">
  <div class="blob" style="width:620px;height:620px;left:-260px;bottom:-330px;background:var(--sun)"></div>
  <div class="blob" style="width:520px;height:520px;right:-200px;top:-260px;background:var(--mint)"></div>
  <div class="copy">
    <div class="kicker">One tap</div>
    <h1>Feed it the post you don't want.</h1>
    <div class="steps">
      <div class="step"><b>1</b>Tap Feed on any post</div>
      <div class="step"><b>2</b>GomiMon sits down to eat</div>
      <div class="step"><b>3</b>The post is gone from your view</div>
    </div>
  </div>
  <div class="browser" style="left:500px;top:92px;width:740px;height:620px">
    <div class="bar"><i></i><i></i><i></i></div>
    <div style="overflow:hidden;height:576px"><img src="img/eating.png" style="width:956px;margin-left:-194px;margin-top:-50px"></div>
  </div>
  <div class="zoom" style="left:76px;top:600px;width:300px;height:84px">
    <img src="img/feed.png" style="width:1920px;margin-left:-807px;margin-top:-489px">
  </div>
  <div class="zoom-label" style="position:absolute;left:76px;top:566px;font-family:Silkscreen,monospace;font-size:15px;letter-spacing:.1em">Added to every post</div>
  <div class="foot" style="left:76px;bottom:34px">Sample feed shown. Feeding changes only your own view of the page.</div>
</div></body></html>
