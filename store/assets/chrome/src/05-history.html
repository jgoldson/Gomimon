<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.copy { position: absolute; left: 76px; top: 110px; width: 440px; }
.copy h1 { margin: 24px 0 24px; font-size: 60px; }
ul { list-style: none; margin-top: 30px; display: grid; gap: 14px; }
li { font-size: 22px; line-height: 1.35; padding-left: 34px; position: relative; }
li::before { content: ""; position: absolute; left: 0; top: 8px; width: 16px; height: 16px; border-radius: 4px; background: var(--lilac); }
</style></head><body><div class="stage">
  <div class="blob" style="width:760px;height:760px;right:-240px;bottom:-380px;background:var(--sun)"></div>
  <div class="blob" style="width:380px;height:380px;right:300px;top:-220px;background:var(--mint)"></div>
  <div class="copy">
    <div class="kicker">Stay in control</div>
    <h1>See every meal it eats.</h1>
    <ul>
      <li>Slop history shows recent meals, stored only in your browser</li>
      <li>Restore any auto-hidden X post with <b>Show post</b></li>
      <li>Join the meal leaderboard, or don't. It's optional.</li>
    </ul>
  </div>
  <img class="device" src="img/leaderboard.png" style="right:56px;top:150px;height:560px;transform:rotate(3deg)">
  <img class="device" src="img/history.png" style="right:330px;top:56px;height:640px;transform:rotate(-2deg)">
  <div class="foot" style="left:76px;bottom:34px">Example data shown. GomiMon never posts, reports, or flags content for you.</div>
</div></body></html>
