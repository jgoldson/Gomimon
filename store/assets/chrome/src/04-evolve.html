<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.head { position: absolute; left: 0; right: 0; top: 74px; text-align: center; }
.head h1 { margin-top: 20px; }
.head p { margin-top: 18px; }
.lcd { position: absolute; left: 70px; right: 70px; top: 330px; height: 380px; border: 14px solid #223b33; border-radius: 34px; background: var(--lcd);
  background-image: linear-gradient(rgba(31,70,55,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(31,70,55,.06) 1px, transparent 1px); background-size: 6px 6px;
  box-shadow: 0 0 0 10px #e9c766, 0 22px 40px rgba(80,60,10,.25); display: flex; align-items: flex-end; justify-content: space-around; padding: 0 30px 40px; }
.stage-col { display: flex; flex-direction: column; align-items: center; color: var(--lcd-ink); }
.stage-col .spr { height: 210px; display: flex; align-items: flex-end; }
.stage-col img { image-rendering: pixelated; }
.name { font-family: Silkscreen, monospace; font-size: 22px; margin-top: 16px; letter-spacing: .06em; }
.meals { font-family: Silkscreen, monospace; font-size: 15px; opacity: .75; margin-top: 6px; }
.arrow { font-family: Silkscreen, monospace; font-size: 56px; color: var(--lcd-ink); align-self: center; margin-top: -60px; opacity: .55; }
</style></head><body><div class="stage">
  <div class="blob" style="width:520px;height:520px;left:-220px;top:-260px;background:var(--sun)"></div>
  <div class="blob" style="width:420px;height:420px;right:-160px;top:-200px;background:var(--mint)"></div>
  <div class="head">
    <div class="kicker">Hatch · Feed · Evolve</div>
    <h1>Every meal helps it grow.</h1>
    <p class="lede">Keep it fed and its glitch meter low, and your GomiMon evolves.</p>
  </div>
  <div class="lcd">
    <div class="stage-col"><div class="spr"><img src="img/egg1-t.png" style="height:120px"></div><div class="name">Egg</div><div class="meals">Hatch &amp; name it</div></div>
    <div class="arrow">›</div>
    <div class="stage-col"><div class="spr"><img src="img/baby1-t.png" style="height:120px"></div><div class="name">Baby-Gomi</div><div class="meals">First meal</div></div>
    <div class="arrow">›</div>
    <div class="stage-col"><div class="spr"><img src="img/bubble-gomi-t.png" style="height:160px"></div><div class="name">Bubble-Gomi</div><div class="meals">100 meals</div></div>
    <div class="arrow">›</div>
    <div class="stage-col"><div class="spr"><img src="img/nimbus-gomi-t.png" style="height:200px"></div><div class="name">Nimbus-Gomi</div><div class="meals">1,000 meals</div></div>
  </div>
</div></body></html>
