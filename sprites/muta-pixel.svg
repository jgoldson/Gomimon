<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Muta-Pixel sprite - surreal creature with weird limbs -->
  <defs>
    <linearGradient id="weirdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6ec4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7873f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main body - asymmetric -->
  <ellipse cx="50" cy="55" rx="25" ry="30" fill="url(#weirdGrad)" stroke="#333" stroke-width="2"/>

  <!-- Extra limbs in weird places -->
  <path d="M 25 50 L 15 45 L 10 50" stroke="#764ba2" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 75 60 L 85 55 L 90 62" stroke="#764ba2" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 40 85 L 35 95" stroke="#764ba2" stroke-width="3" stroke-linecap="round"/>
  <path d="M 60 85 L 68 93" stroke="#764ba2" stroke-width="3" stroke-linecap="round"/>

  <!-- Mismatched eyes -->
  <circle cx="38" cy="50" r="7" fill="#333"/>
  <rect x="55" y="48" width="10" height="10" fill="#333"/>
  <circle cx="40" cy="48" r="2" fill="#fff"/>
  <circle cx="60" cy="53" r="2" fill="#fff"/>

  <!-- Extra eye on body -->
  <circle cx="50" cy="70" r="4" fill="#333"/>
  <circle cx="51" cy="69" r="1" fill="#fff"/>

  <!-- Weird mouth -->
  <path d="M 35 60 Q 50 55 65 62" stroke="#333" stroke-width="2" fill="none"/>
</svg>
