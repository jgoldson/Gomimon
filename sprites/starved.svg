<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Starved/Null-Sprite - sad pixelated version -->
  <defs>
    <filter id="pixelate">
      <feFlood x="0" y="0" height="2" width="2"/>
      <feComposite width="10" height="10"/>
      <feTile result="a"/>
      <feComposite in="SourceGraphic" in2="a" operator="in"/>
      <feMorphology operator="dilate" radius="1"/>
    </filter>
  </defs>

  <!-- Low-res body -->
  <rect x="35" y="50" width="30" height="30" fill="#444" stroke="#222" stroke-width="2"/>

  <!-- X eyes -->
  <line x1="40" y1="58" x2="46" y2="64" stroke="#666" stroke-width="2"/>
  <line x1="46" y1="58" x2="40" y2="64" stroke="#666" stroke-width="2"/>
  <line x1="54" y1="58" x2="60" y2="64" stroke="#666" stroke-width="2"/>
  <line x1="60" y1="58" x2="54" y2="64" stroke="#666" stroke-width="2"/>

  <!-- Sad mouth -->
  <path d="M 42 72 Q 50 68 58 72" stroke="#666" stroke-width="2" fill="none"/>

  <!-- Glitch pixels -->
  <rect x="32" y="52" width="3" height="3" fill="#ff00ff"/>
  <rect x="66" y="58" width="3" height="3" fill="#00ffff"/>
  <rect x="38" y="78" width="3" height="3" fill="#ff00ff"/>

  <!-- Fading effect -->
  <rect x="35" y="50" width="30" height="30" fill="#000" opacity="0.3"/>
</svg>
