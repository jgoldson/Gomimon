<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GomiMon</title>
  <style>
    body {
      width: 300px;
      height: 400px;
      margin: 0;
      padding: 20px;
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
    }

    .pet-container {
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .pet-sprite {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pet-sprite img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    .pet-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .stats {
      width: 100%;
      margin-bottom: 10px;
    }

    .stat-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: bold;
    }

    .stat-bar {
      width: 100%;
      height: 25px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .stat-fill {
      height: 100%;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .hunger-fill {
      background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
    }

    .glitch-fill {
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
    }

    .info {
      margin-top: auto;
      text-align: center;
      font-size: 12px;
      opacity: 0.8;
    }

    .reboot-button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .reboot-button:hover {
      background: #ff6666;
    }

    .crashed {
      background: #000080;
      color: #ffffff;
      border-color: #0000ff;
      animation: bsod-flicker 0.5s ease-in-out;
    }

    .crashed .pet-sprite img {
      animation: glitch 0.3s infinite;
      filter: hue-rotate(180deg) contrast(200%);
    }

    @keyframes glitch {
      0% { transform: translate(0) skew(0deg); }
      20% { transform: translate(-3px, 2px) skew(-2deg); filter: hue-rotate(90deg); }
      40% { transform: translate(-2px, -3px) skew(2deg); filter: hue-rotate(-90deg); }
      60% { transform: translate(3px, 2px) skew(-3deg); filter: hue-rotate(180deg); }
      80% { transform: translate(2px, -2px) skew(3deg); filter: hue-rotate(-180deg); }
      100% { transform: translate(0) skew(0deg); }
    }

    @keyframes bsod-flicker {
      0%, 100% { opacity: 1; }
      20%, 80% { opacity: 0.8; }
      40%, 60% { opacity: 0.9; }
    }

    .pet-sprite img {
      transition: transform 0.3s ease;
    }

    .pet-sprite:hover img {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pet-name" id="petName">GomiMon</div>

    <div class="pet-container" id="petContainer">
      <div class="pet-sprite" id="petSprite">
        <img src="sprites/egg.svg" alt="Egg" />
      </div>
    </div>

    <div class="stats">
      <div class="stat-label">
        <span>HUNGER</span>
        <span id="hungerValue">100</span>
      </div>
      <div class="stat-bar">
        <div class="stat-fill hunger-fill" id="hungerBar" style="width: 100%;">
          <span id="hungerPercent"></span>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat-label">
        <span>GLITCH-O-METER</span>
        <span id="glitchValue">0</span>
      </div>
      <div class="stat-bar">
        <div class="stat-fill glitch-fill" id="glitchBar" style="width: 0%;">
          <span id="glitchPercent"></span>
        </div>
      </div>
    </div>

    <button class="reboot-button" id="rebootButton">REBOOT</button>

    <div class="info" id="infoText">
      Right-click on posts to feed your GomiMon!
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
